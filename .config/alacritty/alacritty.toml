[general]
import = [
    "~/.config/alacritty/themes/monokai_charcoal.toml"
]

[window]

opacity = 0.8

padding.x = 0
padding.y = 0

decorations = "Full"
decorations_theme_variant = "Dark"

[font]
size = 9.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

